name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6 libxi6
      - run: xvfb-run -a mvn --batch-mode clean install spotless:check -Dsecretchat.gui=true
      - run: mvn --batch-mode com.github.spotbugs:spotbugs-maven-plugin:4.10.5.0:check -Dspotbugs.threshold=High
      - run: python3 scripts/audit-dependencies.py
      - run: sh scripts/prepare-local-tls.sh
      - run: docker compose -p secretchat-acceptance --env-file .local/tls/stack.env -f compose.secure.yaml up --build -d
      - run: curl --fail --retry 20 --retry-all-errors --retry-delay 1 --cacert .local/tls/localhost.crt https://localhost:18443/actuator/health
      - run: mvn --batch-mode verify -Dtest=DeploymentSmokeTest -Dsurefire.failIfNoSpecifiedTests=false -Dsecretchat.deployment=true
      - run: sh scripts/verify-restore.sh
      - run: python3 scripts/scan-container-offline.py
      - name: Stop isolated acceptance services
        if: always()
        run: |
          if [ -f .local/tls/stack.env ]; then
            docker compose -p secretchat-acceptance --env-file .local/tls/stack.env -f compose.secure.yaml down -v
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/gui-evidence/
            docs/verification/dependency-audit.json
            docs/verification/container-scan*.json
